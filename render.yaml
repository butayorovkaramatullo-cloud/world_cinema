# Render Blueprint: GitHub repodan backend va PostgreSQL bazani bir bosishda yaratadi.
# Render → New → Blueprint → shu repozitoriyni tanlang.
services:
  - type: web
    name: world-cinema-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: world-cinema-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://butayorovkaramatullo-cloud.github.io
      - key: PAYMENT_PROVIDER
        value: mock
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: world-cinema-db
    plan: free
    databaseName: world_cinema
